name = "lootempire"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

# واجهة التطبيق المصغّر تُخدَم مباشرة من مجلد frontend
# وأي مسار لا يطابق ملفاً (مثل /telegram-webhook) يصل إلى worker.js
[assets]
directory = "./frontend"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "lootempire_users"
database_id = "740890a3-d99c-4271-aa2b-8c3cb3c9fb30"

# BOT_TOKEN و TELEGRAM_WEBHOOK_SECRET يُضبطان كـ Secrets في لوحة Cloudflare (لا تضعهما هنا)
